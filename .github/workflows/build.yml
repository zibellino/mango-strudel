name: Build MangoStrudel APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: MangoStrudel-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1

      - name: Rename and upload APK to release
        if: github.event_name == 'release'
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/MangoStrudel-${{ github.event.release.tag_name }}.apk

      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/MangoStrudel-${{ github.event.release.tag_name }}.apk
          
