name: Build MangoStrudel APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clone and build Strudel REPL
        run: |
          git clone https://codeberg.org/uzu/strudel.git --depth=1
          cd strudel
          npm install -g pnpm
          pnpm install --frozen-lockfile=false
          pnpm run build
          pnpm --filter @strudel/repl build
          mkdir -p $GITHUB_WORKSPACE/app/src/main/assets/strudel
          cp -r packages/repl/dist/. $GITHUB_WORKSPACE/app/src/main/assets/strudel/
          find $GITHUB_WORKSPACE/app/src/main/assets/strudel -name "*.html" | sort
          echo "Strudel built"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MangoStrudel-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
